name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0 ;
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" ;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force ;
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue ;
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue ;
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi" ;
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait ;
          Start-Sleep -Seconds 5 ;
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" ;
          Start-Sleep -Seconds 8 ;
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 ;
          "TS_IP=$ts_ip" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append ;
          Write-Host "Tailscale IP : $ts_ip"

      - name: 4. Send Info to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          Add-Type -AssemblyName System.Web ;
          $bot =$env:TELEGRAM_BOT_TOKEN ;
          $chat =$env:TELEGRAM_CHAT_ID ;
          $ip =$env:TS_IP ;
          if ($bot -and $chat) {$rawMsg = "🚀 *New Windows VPS Ready!*`n`n🌐 *Tailscale IP:* `$ip``n👤 *User:* `NvDAdmin``n🔑 *Pass:* `P@ssw0rd1qazXSW@#``n⏳ *Valid for:* 6 Hours" ;
            $encodedMsg = [System.Web.HttpUtility]::UrlEncode($rawMsg) ;
            $url = "https://api.telegram.org/bot$bot/sendMessage?chat_id=$chat&text=$encodedMsg&parse_mode=Markdown" ;
            Invoke-RestMethod -Uri $url -Method Get ;
          }

      - name: 5. Keep Server Alive (up to 5.5 Hours)
        run: |
          for ($i = 1; $i -le 330; $i++) {
            Start-Sleep -Seconds 60 ;
            Write-Host "[$i/330] Server running..." ;
          }

      - name: 6. Trigger Next Workflow Automatically
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $repo = "${{ github.repository }}" ;
          $workflow = "windows-rdp.yml" ;
          $url = "https://api.github.com/repos/$repo/actions/workflows/$workflow/dispatches" ;
          $headers = @{
            "Authorization" = "Bearer $env:GH_PAT"
            "Accept"        = "application/vnd.github.v3+json"
            "User-Agent"    = "PowerShell"
          } ;
          $bodyData = @{ ref = "main" } | ConvertTo-Json ;
          Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body$bodyData ;
